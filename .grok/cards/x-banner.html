<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>banner</title>
  <style>
    @font-face {
      font-family: "Syne";
      font-weight: 800;
      src: url("../fonts/8vIH7w4qzmVxm2BL9A.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-weight: 500;
      src: url("../fonts/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #0c0e12; }
    .stage {
      position: relative;
      width: 1200px;
      height: 264px;
      background:
        radial-gradient(ellipse 50% 120% at 78% 40%, rgba(125, 154, 138, 0.20), transparent 60%),
        radial-gradient(ellipse 36% 90% at 18% 30%, rgba(125, 154, 138, 0.10), transparent 70%),
        #0c0e12;
      color: #ecece8;
      -webkit-font-smoothing: antialiased;
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(236, 236, 232, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 236, 232, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 70%, transparent 100%);
    }
    .scan {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(12, 14, 18, 0.2) 0 1px,
        transparent 1px 3px
      );
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 28px;
      width: 520px;
    }
    .mark {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.4em;
      color: #7d9a8a;
      margin-bottom: 8px;
    }
    h1 {
      font-family: "Syne", "Liberation Sans Narrow", sans-serif;
      font-weight: 800;
      font-size: 54px;
      line-height: 0.9;
      letter-spacing: 0.10em;
      color: #ecece8;
    }
    h1 span {
      display: block;
      font-size: 28px;
      letter-spacing: 0.18em;
      margin-top: 4px;
    }
    .rule {
      width: 88px;
      height: 3px;
      background: #7d9a8a;
      margin-top: 12px;
      border-radius: 2px;
    }
    .chevs {
      position: absolute;
      right: 64px;
      top: 22px;
      width: 420px;
      height: 180px;
      opacity: 0.34;
    }
    .hud {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #7d9a8a;
      opacity: 0.5;
    }
    .hud.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
    .hud.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <svg class="chevs" viewBox="0 0 420 180" fill="none" aria-hidden="true">
      <path d="M70 20 L20 90 L70 160" stroke="#7d9a8a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M130 20 L80 90 L130 160" stroke="#3d8b6e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <path d="M350 20 L400 90 L350 160" stroke="#7d9a8a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M290 20 L340 90 L290 160" stroke="#c45c4a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    </svg>
    <div class="hud tl"></div>
    <div class="hud tr"></div>
    <div class="lockup">
      <div class="mark"></></div>
      <h1>NETTECH<span>FRONTEND CBT</span></h1>
      <div class="rule"></div>
    </div>
    <div class="scan"></div>
  </div>
</body>
</html>
